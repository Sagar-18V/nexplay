# Alembic owns the schema from Step 7 on (Prisma's migrations live on as revision 0001).
# The database URL comes from DATABASE_URL (see migrations/env.py), never from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

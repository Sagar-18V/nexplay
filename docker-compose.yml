# NexPay after the migration: FastAPI + Celery on Postgres + Redis, behind nginx.
# Secrets (JWT_SECRET, JWT_REFRESH_SECRET, ...) come from api-py/.env (git-ignored).

x-api-env: &api-env
  env_file:
    - path: ./api-py/.env
      required: false
  environment:
    DATABASE_URL: postgresql://nexpay:nexpay_dev@postgres:5432/nexpay
    REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexpay
      POSTGRES_PASSWORD: nexpay_dev
      POSTGRES_DB: nexpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: Alembic owns the schema. Fresh DB -> full build; DB that Prisma built
  # (pre-Step 7 volume) -> verified, stamped at the baseline, then upgraded.
  migrate:
    build: ./api-py
    command: ["python", "-m", "app.ops.migrate"]
    <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-py:
    build: ./api-py
    <<: *api-env
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery workers: webhooks, refunds, reconciliation (replaced BullMQ in Steps 5-6).
  worker:
    build: ./api-py
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "webhooks,refunds,recon", "-c", "10", "-l", "INFO"]
    <<: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery beat: daily 02:00 UTC reconciliation. Run exactly ONE.
  beat:
    build: ./api-py
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "INFO", "-s", "/tmp/celerybeat-schedule"]
    <<: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Single public entry point.
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-py:
        condition: service_healthy

volumes:
  pgdata:

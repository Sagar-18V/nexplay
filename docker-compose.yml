version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: nexplay_postgres
    environment:
      POSTGRES_USER: nexplay
      POSTGRES_PASSWORD: nexplay_secret
      POSTGRES_DB: nexplay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexplay_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
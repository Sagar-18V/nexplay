services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexpay
      POSTGRES_PASSWORD: nexpay_dev
      POSTGRES_DB: nexpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single public entry point. Routes each /v1 path to Express or FastAPI.
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      api-py:
        condition: service_healthy

  # Legacy Express service. Still owns the DB schema (runs prisma migrate deploy).
  backend:
    build: ./backend
    env_file: ./backend/.env          # JWT secrets etc. (shared with api-py)
    environment:                       # overrides .env -> local containers
      DATABASE_URL: postgresql://nexpay:nexpay_dev@postgres:5432/nexpay
      REDIS_URL: redis://redis:6379
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # node:alpine ships wget, not curl. Express has no /v1/health (FastAPI owns it now).
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # New FastAPI service. Same DB, same Redis, same secrets. Never runs migrations.
  api-py:
    build: ./api-py
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://nexpay:nexpay_dev@postgres:5432/nexpay
      REDIS_URL: redis://redis:6379
    expose:
      - "8000"
    depends_on:
      backend:
        condition: service_healthy     # wait until Prisma migrations have run
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery worker: replaces the BullMQ webhook worker for events emitted by FastAPI.
  # Express's BullMQ worker keeps draining its own queue until Step 6 moves redeliver.
  worker:
    build: ./api-py
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "webhooks", "-c", "10", "-l", "INFO"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://nexpay:nexpay_dev@postgres:5432/nexpay
      REDIS_URL: redis://redis:6379
    depends_on:
      api-py:
        condition: service_healthy

volumes:
  pgdata:

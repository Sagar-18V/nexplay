# NexPay edge gateway.
#
# During the migration (Steps 1-6) this was the strangler facade that routed each path to
# Express or FastAPI, then split payment writes by canary. Express is gone (Step 7), so it
# is a plain reverse proxy now. It stays because it still earns its place: one public
# entry point, a request id stamped on every call, and the place TLS/limits would live.

events {}

http {
    resolver 127.0.0.11 valid=10s;

    upstream api { server api-py:8000; }

    log_format edge escape=json '{"requestId":"$request_id","method":"$request_method",'
                               '"path":"$request_uri","status":$status,'
                               '"durationMs":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout edge;

    server {
        listen 8080;

        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header       X-Request-Id      $request_id always;

        location / {
            proxy_pass http://api;
        }
    }
}

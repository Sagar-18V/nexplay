# NexPay edge gateway — the "strangler facade".
#
# Every client request enters here. Each route is owned by exactly one backend:
#   - api_py   : FastAPI (new)   — routes listed explicitly below
#   - api_node : Express (legacy) — everything else under /v1/
#
# Migrating a route = add a location block pointing at api_py, reload nginx.
# Rolling back       = delete that block, reload nginx. No client changes, no redeploys.
# Keep this file in sync with MIGRATION.md (the route ownership table).

events {}

http {
    # Docker's embedded DNS, so upstream containers are re-resolved if they restart.
    resolver 127.0.0.11 valid=10s;

    upstream api_node { server backend:3000; }
    upstream api_py   { server api-py:8000; }

    # One log format for the gateway, tagged with which backend served the request.
    log_format edge escape=json '{"requestId":"$request_id","method":"$request_method",'
                               '"path":"$request_uri","status":$status,'
                               '"durationMs":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout edge;

    server {
        listen 8080;

        # Same request id flows gateway -> backend -> logs -> error responses.
        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header       X-Request-Id      $request_id always;

        # ---------------------------------------------------------------
        # MIGRATED TO FASTAPI (most specific first)
        # ---------------------------------------------------------------
        location = /v1/health {
            add_header X-Served-By api-py always;
            proxy_pass http://api_py;
        }

        # Step 3: register, login, refresh, logout, me, merchants.
        # Rollback: delete this block + `nginx -s reload`. Sessions survive either way:
        # tokens/refresh keys are interchangeable (tests/contract/test_auth_interop.py).
        location /v1/auth/ {
            add_header X-Served-By api-py always;
            proxy_pass http://api_py;
        }

        # ---------------------------------------------------------------
        # LEGACY EXPRESS (default for everything not yet migrated)
        # ---------------------------------------------------------------
        location /v1/ {
            add_header X-Served-By api-node always;
            proxy_pass http://api_node;
        }

        location = / {
            proxy_pass http://api_node;
        }
    }
}

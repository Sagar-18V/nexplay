# NexPay edge gateway — the "strangler facade".
#
# Every client request enters here. Each route is owned by exactly one backend:
#   - api_py   : FastAPI (new)   — routes listed explicitly below
#   - api_node : Express (legacy) — everything else under /v1/
#
# Migrating a route = add a location block pointing at api_py, reload nginx.
# Rolling back       = delete that block, reload nginx. No client changes, no redeploys.
# Keep this file in sync with MIGRATION.md (the route ownership table).

events {}

http {
    # Docker's embedded DNS, so upstream containers are re-resolved if they restart.
    resolver 127.0.0.11 valid=10s;

    upstream api_node { server backend:3000; }
    upstream api_py   { server api-py:8000; }

    # One log format for the gateway, tagged with which backend served the request.
    log_format edge escape=json '{"requestId":"$request_id","method":"$request_method",'
                               '"path":"$request_uri","status":$status,'
                               '"durationMs":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout edge;

    # Step 4: on paths that mix reads and writes, GETs go to FastAPI and writes stay
    # on Express until their step (POST intents/process: 5, refunds/redeliver/trigger: 6).
    map $request_method $reads_upstream {
        GET     api_py;
        HEAD    api_py;
        default api_node;
    }
    map $request_method $reads_served_by {
        GET     api-py;
        HEAD    api-py;
        default api-node;
    }

    # Step 5: payment WRITES are a canary. A stable share of sessions (hash of the bearer
    # token, so one session sticks to one backend) goes to FastAPI. Ramp by editing the
    # percentage and `nginx -s reload`: 10% -> 50% -> 100%. Rollback: set it to 0%.
    # Safe to split because both backends share the DB, both claim intents atomically,
    # and tests/contract/test_payments_interop.py races the two against each other.
    split_clients "${http_authorization}" $payments_canary {
        10%     py;
        *       node;
    }
    # X-NexPay-Backend: py|node pins a request (operators, smoke tests, contract suite).
    map "$request_method:$http_x_nexpay_backend:$payments_canary" $payments_upstream {
        "~^(GET|HEAD):"     api_py;      # reads: fully migrated in Step 4
        "~^[A-Z]+:node:"    api_node;
        "~^[A-Z]+:py:"      api_py;
        "~:py$"             api_py;      # in the canary share
        default             api_node;
    }
    map $payments_upstream $payments_served_by {
        api_py   api-py;
        default  api-node;
    }

    server {
        listen 8080;

        # Same request id flows gateway -> backend -> logs -> error responses.
        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header       X-Request-Id      $request_id always;

        # ---------------------------------------------------------------
        # MIGRATED TO FASTAPI (most specific first)
        # ---------------------------------------------------------------
        location = /v1/health {
            add_header X-Served-By api-py always;
            proxy_pass http://api_py;
        }

        # Step 3: register, login, refresh, logout, me, merchants.
        # Rollback: delete this block + `nginx -s reload`. Sessions survive either way:
        # tokens/refresh keys are interchangeable (tests/contract/test_auth_interop.py).
        location /v1/auth/ {
            add_header X-Served-By api-py always;
            proxy_pass http://api_py;
        }

        # Step 4: read endpoints (split by method, see the maps above).
        # Rollback: delete these blocks + reload. Gate: tests/contract + shadow_diff 100% match.
        location /v1/payments/      { add_header X-Served-By $payments_served_by always; proxy_pass http://$payments_upstream; }  # reads + Step 5 canary
        location /v1/refunds        { add_header X-Served-By $reads_served_by always; proxy_pass http://$reads_upstream; }
        location /v1/reconciliation/ { add_header X-Served-By $reads_served_by always; proxy_pass http://$reads_upstream; }
        location /v1/webhooks/      { add_header X-Served-By $reads_served_by always; proxy_pass http://$reads_upstream; }
        location /v1/metrics        { add_header X-Served-By api-py always;           proxy_pass http://api_py; }

        # ---------------------------------------------------------------
        # LEGACY EXPRESS (default for everything not yet migrated)
        # ---------------------------------------------------------------
        location /v1/ {
            add_header X-Served-By api-node always;
            proxy_pass http://api_node;
        }

        location = / {
            proxy_pass http://api_node;
        }
    }
}
